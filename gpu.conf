#!/bin/bash
#################################################################
# TIGER2 GPU Configuration
# 集中管理 NVIDIA / AMD / CPU 配置
# 修改此文件即可切换计算平台
#################################################################

# ======================== 平台选择 ========================
# 可选值: auto | nvidia | amd | cpu
GPU_BACKEND="auto"

# ======================== NAMD 配置 ========================
# NAMD 二进制路径（留空使用系统默认 namd2）
NAMDBINARY=""

# MPI 启动选项
MPI_OPTS="-n 8"

# ======================== OpenMM 配置 ========================
# OpenMM 平台（用于隐式溶剂能量计算）
# 可选值: auto | CPU | CUDA | OpenCL
OPENMM_PLATFORM="auto"

# 计算精度
# single | mixed | double
OPENMM_PRECISION="mixed"

# ======================== 多 GPU 调度 ========================
# 0: 单 GPU（所有 replica 共享）
# 1: 多 GPU（自动轮询分配）
MULTI_GPU_SCHEDULING=1

# GPU 列表（留空则自动检测）
# NVIDIA: "0,1,2,3"
# AMD:    "0:0,0:1,1:0,1:1"
GPU_LIST=""

# ======================== 自动检测函数 ========================

detect_gpu_backend() {
    if [ "$GPU_BACKEND" != "auto" ]; then
        return
    fi
    if command -v nvidia-smi &>/dev/null && nvidia-smi &>/dev/null 2>&1; then
        GPU_BACKEND="nvidia"
        return
    fi
    if command -v rocm-smi &>/dev/null && rocm-smi &>/dev/null 2>&1; then
        GPU_BACKEND="amd"
        return
    fi
    GPU_BACKEND="cpu"
}

auto_configure_namd() {
    case "$GPU_BACKEND" in
        nvidia)
            NAMD_GPU_OPTS="+devices 0"
            ;;
        amd)
            NAMD_GPU_OPTS="+devices 0"
            ;;
        cpu)
            NAMD_GPU_OPTS="+p 8"
            ;;
    esac
}

auto_configure_openmm() {
    if [ "$OPENMM_PLATFORM" = "auto" ]; then
        case "$GPU_BACKEND" in
            nvidia) OPENMM_PLATFORM="CUDA" ;;
            amd)    OPENMM_PLATFORM="OpenCL" ;;
            cpu)    OPENMM_PLATFORM="CPU" ;;
        esac
    fi
}

detect_multi_gpu() {
    if [ "$MULTI_GPU_SCHEDULING" -ne 1 ]; then
        return
    fi
    if [ -n "$GPU_LIST" ]; then
        return
    fi
    case "$GPU_BACKEND" in
        nvidia)
            GPU_LIST=$(nvidia-smi --query-gpu=index --format=csv,noheader,nounits 2>/dev/null | tr '\n' ',' | sed 's/,$//')
            ;;
        amd)
            GPU_LIST=$(clinfo -l 2>/dev/null | grep -oP '\d+:\d+' | tr '\n' ',' | sed 's/,$//')
            ;;
    esac
    [ -z "$GPU_LIST" ] && GPU_LIST="0"
}

build_ommpre() {
    # 构建 OpenMM 启动前缀
    if [ "$OPENMM_PLATFORM" = "CUDA" ]; then
        ommpre="CUDA_VISIBLE_DEVICES=0"
    else
        ommpre=""
    fi
}

# ======================== 设置原始变量名 ========================
# 以下函数将 GPU 配置映射到 TIGER2 原始变量名
# template.sh 无需修改这些变量的引用

apply_to_template() {
    # 设置 tigerimplplatform（template.sh 行 15）
    tigerimplplatform="${OPENMM_PLATFORM}"

    # 设置 RUNOPT（template.sh 行 44）
    RUNOPT="${MPI_OPTS}"

    # 设置 NAMDOPT（template.sh 行 45）
    NAMDOPT="${NAMD_GPU_OPTS}"

    # 构建 ommpre（template.sh 行 23）
    build_ommpre
}

# ======================== 执行自动配置 ========================
detect_gpu_backend
auto_configure_namd
auto_configure_openmm
detect_multi_gpu
apply_to_template
